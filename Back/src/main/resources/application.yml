server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: my-personal-tasks
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  datasource:
    url: jdbc:h2:file:./data/my_personal_tasks;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: false

jwt:
  secret: myPersonalTasksSuperSecretKeyThatIsLongEnoughForHS256Algorithm2024
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

springdoc:
  api-docs:
    path: /swagger-ui/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.mypersonaltasks: DEBUG
    org.springframework.security: INFO
